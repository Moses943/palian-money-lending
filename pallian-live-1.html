/* ============================== SUPABASE REST HELPERS ============================== */
/* Talks to Postgres directly via Supabase's PostgREST API — no bundler needed,
   matching the spec's "browser talks straight to Supabase" architecture. */

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

function sbHeaders(extra) {
  return { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json", ...extra };
}

async function sbSelect(table, query) {
  const res = await fetch(REST + table + "?select=*" + (query ? "&" + query : ""), { headers: sbHeaders() });
  if (!res.ok) throw new Error(table + ": " + (await res.text()));
  return res.json();
}
async function sbInsert(table, row) {
  const res = await fetch(REST + table, { method: "POST", headers: sbHeaders({ Prefer: "return=representation" }), body: JSON.stringify(row) });
  if (!res.ok) throw new Error(table + " insert failed: " + (await res.text()));
  const data = await res.json();
  return Array.isArray(data) ? data[0] : data;
}
async function sbUpdate(table, idCol, idVal, patch) {
  const res = await fetch(REST + table + "?" + idCol + "=eq." + encodeURIComponent(idVal), { method: "PATCH", headers: sbHeaders({ Prefer: "return=representation" }), body: JSON.stringify(patch) });
  if (!res.ok) throw new Error(table + " update failed: " + (await res.text()));
  const data = await res.json();
  return Array.isArray(data) ? data[0] : data;
}
async function sbUpsert(table, row, onConflict) {
  const res = await fetch(REST + table + (onConflict ? "?on_conflict=" + onConflict : ""), { method: "POST", headers: sbHeaders({ Prefer: "resolution=merge-duplicates,return=representation" }), body: JSON.stringify(row) });
  if (!res.ok) throw new Error(table + " upsert failed: " + (await res.text()));
  const data = await res.json();
  return Array.isArray(data) ? data[0] : data;
}

/* ============================== LOAN LOGIC ============================== */

const ROLLOVER_RATE = 30;

/* Penalty ladder: 5%/day for up to 7 days late (max 35%), flat 35% from day 30.
   If a loan is still not cleared 30 days after its due date, the balance is
   automatically re-loaned at 30% (see the auto-rollover effect in the root).
   A rollover loan carries no further penalty — the 30% is the last one. */
function loanMath(loan, payments) {
  const paid = payments.filter((p) => p.loan_id === loan.id).reduce((s, p) => s + Number(p.amount), 0);
  const principal = Number(loan.principal);
  const interest = principal * (Number(loan.rate) / 100);
  const baseOwed = principal + interest;
  const lateDays = Math.max(0, daysBetween(loan.due_date, todayISO()));
  const isRollover = !!loan.rollover_of;
  let penalty = 0;
  let status = "Active";
  if (!isRollover) {
    if (lateDays > 0 && lateDays < 30) penalty = baseOwed * 0.05 * Math.min(lateDays, 7);
    else if (lateDays >= 30) penalty = baseOwed * 0.35;
  }
  if (lateDays >= 30) status = "Defaulted";
  else if (lateDays > 0) status = "Overdue";
  const totalOwed = baseOwed + penalty;
  const balance = Math.max(0, totalOwed - paid);
  if (balance <= 0.5) status = "Cleared";
  if (loan.rolled_over_to) {
    return { interest, baseOwed, penalty, totalOwed: paid, paid, balance: 0, lateDays, status: "Rolled over", carried: Math.max(0, totalOwed - paid) };
  }
  return { interest, baseOwed, penalty, totalOwed, paid, balance, lateDays, status };
}

const STATUS_COLOR = { "Rolled over": MUTED, Pending: GOLD, Active: BLUE, Overdue: GOLD, Defaulted: RED, Cleared: GREEN, Rejected: RED };

function scopeByRole(user, items, branchKey, provinceKey) {
  branchKey = branchKey || "branch"; provinceKey = provinceKey || "province";
  if (HO_ROLES.includes(user.role)) return items;
  if (user.role === "provincial_manager") return items.filter((i) => i[provinceKey] === user.province);
  return items.filter((i) => i[branchKey] === user.branch);
}

function Donut({ value, label, sub, color, size = 118 }) {
  const r = size * 0.41; const c = 2 * Math.PI * r; const off = c - (value / 100) * c; const cx = size / 2;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
      <svg width={size} height={size} viewBox={"0 0 " + size + " " + size}>
        <circle cx={cx} cy={cx} r={r} fill="none" stroke={LINE} strokeWidth="12" />
        <circle cx={cx} cy={cx} r={r} fill="none" stroke={color} strokeWidth="12" strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round" transform={"rotate(-90 " + cx + " " + cx + ")"} />
        <text x={cx} y={cx - 4} textAnchor="middle" fontSize="22" fontWeight="700" fill={NAVY} fontFamily={FONT_SERIF}>{value}%</text>
        <text x={cx} y={cx + 13} textAnchor="middle" fontSize="9.5" fill={MUTED} fontFamily={FONT_SANS}>{sub}</text>
      </svg>
      <div style={{ fontSize: 12, letterSpacing: "0.06em", textTransform: "uppercase", color: MUTED, fontWeight: 600, maxWidth: 90 }}>{label}</div>
    </div>
  );
}
function ArcDivider() {
  return (
    <svg width="100%" height="28" viewBox="0 0 600 28" preserveAspectRatio="none" style={{ display: "block", marginTop: 14 }}>
      <path d="M0 24 Q150 -8 300 16 T600 8" fill="none" stroke={BLUE} strokeWidth="2.5" opacity="0.5" />
      <path d="M0 26 Q150 0 300 20 T600 14" fill="none" stroke={GOLD} strokeWidth="2.5" opacity="0.5" />
      <path d="M0 28 Q150 6 300 24 T600 19" fill="none" stroke={RED} strokeWidth="2.5" opacity="0.45" />
    </svg>
  );
}

function DashboardView({ user, loans, payments, clients, backupStatus }) {
  const scopedLoans = scopeByRole(user, loans).filter((l) => l.approval_status === "Approved");
  const computed = scopedLoans.map((l) => ({ ...l, m: loanMath(l, payments) }));
  const totalOwed = computed.reduce((s, l) => s + l.m.totalOwed, 0);
  const totalPaid = computed.reduce((s, l) => s + l.m.paid, 0);
  const recovery = totalOwed > 0 ? Math.round((totalPaid / totalOwed) * 100) : 0;
  const overdue = computed.filter((l) => l.m.status === "Overdue" || l.m.status === "Defaulted");
  const pending = scopeByRole(user, loans).filter((l) => l.approval_status === "Pending");
  const isNational = HO_ROLES.includes(user.role);
  const isProvincial = user.role === "provincial_manager";

  const byProvince = PROVINCES.map((p) => {
    const inProv = computed.filter((l) => l.province === p);
    const owed = inProv.reduce((s, l) => s + l.m.totalOwed, 0);
    const paid = inProv.reduce((s, l) => s + l.m.paid, 0);
    const rate = owed > 0 ? Math.round((paid / owed) * 100) : null;
    return { name: p, rate, count: inProv.length };
  }).filter((p) => p.rate !== null);

  return (
    <div>
      <Card style={{ padding: "22px 26px" }}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 30, justifyContent: "space-between", alignItems: "center" }}>
          <Donut value={recovery} label="Recovery rate" sub={isNational ? "national" : isProvincial ? user.province : user.branch} color={BLUE} />
          <Donut value={overdue.length ? Math.min(99, Math.round((overdue.length / Math.max(computed.length, 1)) * 100)) : 0} label="Loans overdue" sub="of active book" color={GOLD} />
          <div style={{ minWidth: 170 }}>
            <div style={{ fontSize: 12, letterSpacing: "0.06em", textTransform: "uppercase", color: MUTED, fontWeight: 600 }}>{isNational ? "Portfolio outstanding" : "Outstanding balance"}</div>
            <div style={{ fontFamily: FONT_SERIF, fontSize: 27, color: NAVY, fontWeight: 700, marginTop: 4 }}>{fmtK(Math.round(totalOwed - totalPaid))}</div>
            <div style={{ fontSize: 12, color: RED, marginTop: 4, fontWeight: 600 }}>{overdue.length} overdue/defaulted · {pending.length} awaiting approval</div>
          </div>
          <div style={{ minWidth: 150 }}>
            <div style={{ fontSize: 12, letterSpacing: "0.06em", textTransform: "uppercase", color: MUTED, fontWeight: 600 }}>Auto backup</div>
            <div style={{ fontSize: 13, fontWeight: 700, color: backupStatus.enabled ? GREEN : RED, marginTop: 4 }}>{backupStatus.enabled ? "Enabled — Google Drive" : "Disabled"}</div>
            <div style={{ fontSize: 11.5, color: MUTED, marginTop: 2 }}>Last run {backupStatus.last || "—"}</div>
          </div>
        </div>
        <ArcDivider />
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 18, marginTop: 18 }}>
        <Card style={{ padding: "20px 24px" }}>
          <div style={{ fontSize: 12, letterSpacing: "0.06em", textTransform: "uppercase", color: MUTED, fontWeight: 600, marginBottom: 16 }}>Live loan book</div>
          <div style={{ fontSize: 13, lineHeight: 2 }}>
            <div>Loans in scope: <b>{computed.length}</b></div>
            <div>Total disbursed principal: <b>{fmtK(computed.reduce((s, l) => s + Number(l.principal), 0))}</b></div>
            <div>Total collected: <b style={{ color: GREEN }}>{fmtK(Math.round(totalPaid))}</b></div>
            <div>Total outstanding: <b style={{ color: RED }}>{fmtK(Math.round(totalOwed - totalPaid))}</b></div>
          </div>
        </Card>
        <Card style={{ padding: "20px 24px" }}>
          <div style={{ fontSize: 12, letterSpacing: "0.06em", textTransform: "uppercase", color: MUTED, fontWeight: 600, marginBottom: 14 }}>{isNational ? "Provinces by recovery" : "Book snapshot"}</div>
          {isNational ? (byProvince.length === 0 ? <EmptyState text="No approved loans yet." /> : byProvince.map((p) => (
            <div key={p.name} style={{ marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 3 }}>
                <span>{p.name}{p.rate < 50 && <span style={{ color: RED, fontSize: 10, fontWeight: 700, marginLeft: 5 }}>UNDERPERFORMING</span>}</span>
                <span style={{ color: MUTED }}>{p.rate}%</span>
              </div>
              <div style={{ background: BG, borderRadius: 3, height: 6 }}><div style={{ width: p.rate + "%", height: "100%", background: p.rate < 50 ? RED : BLUE, borderRadius: 3 }} /></div>
            </div>
          ))) : (
            <div style={{ fontSize: 13, lineHeight: 2 }}>
              <div>Clients on file: <b>{scopeByRole(user, clients).filter((c) => c.record_status !== "Deleted").length}</b></div>
              <div>Active/overdue loans: <b>{computed.length}</b></div>
              <div>Overdue/defaulted: <b style={{ color: RED }}>{overdue.length}</b></div>
              <div>Awaiting approval: <b style={{ color: GOLD }}>{pending.length}</b></div>
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

/* ============================== CLIENTS ============================== */

function ClientsView({ user, clients, loans, refresh, logAudit, deletionRequests, onError }) {
  const [showNew, setShowNew] = useState(false);
  const [form, setForm] = useState({ name: "", nrc: "", tpin: "", phone: "", nok_name: "" });
  const [dupMatch, setDupMatch] = useState(null);
  const [reqTarget, setReqTarget] = useState(null);
  const [reqReason, setReqReason] = useState("");
  const [busy, setBusy] = useState(false);
  const [editTarget, setEditTarget] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [editReason, setEditReason] = useState("");
  const canEdit = ["branch_manager", "admin", "director", "provincial_manager"].includes(user.role);
  const canApproveDelete = DELETE_AUTHORITY.includes(user.role);

  const visible = scopeByRole(user, clients).filter((c) => c.record_status !== "Deleted");
  const rows = visible.map((c) => {
    const latest = loans.filter((l) => l.client_id === c.id).sort((a, b) => (a.start_date < b.start_date ? 1 : -1))[0];
    return { ...c, latest };
  }).sort((a, b) => { const da = a.latest ? a.latest.start_date : "0"; const db = b.latest ? b.latest.start_date : "0"; return da < db ? 1 : -1; });

  async function submit() {
    if (!form.name || !form.nrc) return;
    setBusy(true);
    try {
      const dup = clients.find((c) => (form.nrc && c.nrc === form.nrc) || (form.tpin && c.tpin === form.tpin));
      if (dup) { setDupMatch(dup); setBusy(false); return; }
      const row = await sbInsert("clients", { ...form, tpin: form.tpin || null, branch: user.branch || "Head Office", province: user.province || null, kyc_status: "Pending", record_status: "Active", created_by: user.id });
      await logAudit("Client registered", row.id, form.name + " (NRC " + form.nrc + ")");
      await refresh(["clients"]);
      setForm({ name: "", nrc: "", tpin: "", phone: "", nok_name: "" });
      setShowNew(false);
    } catch (e) { onError(e.message); }
    setBusy(false);
  }

  const EDIT_FIELDS = ["name", "nrc", "tpin", "phone", "phone_2", "phone_3", "whatsapp", "email", "address", "employer", "bank", "account_number", "nok_name", "nok_phone", "nok_relationship", "branch", "province", "kyc_status"];

  function openEdit(c) {
    const f = {};
    EDIT_FIELDS.forEach((k) => { f[k] = c[k] || ""; });
    f.registered_date = c.created_at ? String(c.created_at).slice(0, 10) : todayISO();
    setEditForm(f);
    setEditReason("");
    setEditTarget(c);
  }

  async function saveEdit() {
    if (!editForm.name || !editForm.nrc) { onError("Name and NRC are required."); return; }
    if (!editReason) { onError("Please give a reason for the change — it is recorded in the audit trail."); return; }
    const dup = clients.find((c) => c.id !== editTarget.id && ((editForm.nrc && c.nrc === editForm.nrc) || (editForm.tpin && c.tpin === editForm.tpin)));
    if (dup) { onError("Another client (" + dup.name + ") already uses this NRC or TPIN."); return; }
    const patch = {};
    const changes = [];
    EDIT_FIELDS.forEach((k) => {
      const oldV = editTarget[k] || "";
      const newV = editForm[k] || "";
      if (oldV !== newV) {
        patch[k] = (k === "tpin" && !newV) ? null : newV;
        changes.push(k + ": " + (oldV || "—") + " → " + (newV || "—"));
      }
    });
    const oldDate = editTarget.created_at ? String(editTarget.created_at).slice(0, 10) : "";
    if (editForm.registered_date && editForm.registered_date !== oldDate) {
      const timePart = editTarget.created_at ? String(editTarget.created_at).slice(10) : "T12:00:00+00:00";
      patch.created_at = editForm.registered_date + timePart;
      changes.push("registered date: " + (oldDate || "—") + " → " + editForm.registered_date);
    }
    if (changes.length === 0) { setEditTarget(null); return; }
    setBusy(true);
    try {
      await sbUpdate("clients", "id", editTarget.id, patch);
      await logAudit("Client edited", editTarget.id, changes.join("; ") + " · reason: " + editReason);
      await refresh(["clients"]);
      setEditTarget(null);
    } catch (e) { onError(e.message); }
    setBusy(false);
  }

  async function requestDeletion() {
    if (!reqTarget || !reqReason) return;
    try {
      await sbInsert("deletion_requests", { client_id: reqTarget.id, reason: reqReason, requested_by: user.name });
      await logAudit("Client deletion requested", reqTarget.id, reqReason);
      await refresh(["deletionRequests"]);
      setReqTarget(null); setReqReason("");
    } catch (e) { onError(e.message); }
  }

  async function decideDeletion(d, approve) {
    try {
      await sbUpdate("deletion_requests", "id", d.id, { status: approve ? "Approved" : "Rejected" });
      if (approve) {
        await sbUpdate("clients", "id", d.client_id, { record_status: "Deleted" });
        await logAudit("Client deletion approved (soft delete)", d.client_id, d.reason);
      }
      await refresh(["clients", "deletionRequests"]);
    } catch (e) { onError(e.message); }
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
        <div style={{ fontFamily: FONT_SERIF, fontSize: 19, color: NAVY }}>Clients &amp; KYC</div>
        <Btn onClick={() => setShowNew(true)} variant="gold">+ Register client</Btn>
      </div>
      <Card>
        {rows.length === 0 ? <EmptyState text="No clients in your scope yet." /> : (
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead><tr style={{ textAlign: "left", background: BG }}>{["Name", "NRC", "TPIN", "KYC", "Next of kin", "Registered", "Latest loan", ""].map((h) => <th key={h} style={{ padding: "10px 14px", fontSize: 11, color: MUTED, textTransform: "uppercase", letterSpacing: "0.04em" }}>{h}</th>)}</tr></thead>
            <tbody>{rows.map((c) => (
              <tr key={c.id} style={{ borderTop: "1px solid " + LINE }}>
                <td style={{ padding: "10px 14px", fontWeight: 600 }}>{c.name}</td>
                <td style={{ padding: "10px 14px" }}>{c.nrc}</td>
                <td style={{ padding: "10px 14px" }}>{c.tpin || "—"}</td>
                <td style={{ padding: "10px 14px" }}><Badge text={c.kyc_status} color={c.kyc_status === "Verified" ? GREEN : GOLD} /></td>
                <td style={{ padding: "10px 14px" }}>{c.nok_name}</td>
                <td style={{ padding: "10px 14px" }}>{c.created_at ? String(c.created_at).slice(0, 10) : "—"}</td>
                <td style={{ padding: "10px 14px" }}>{c.latest ? c.latest.id + " · " + c.latest.start_date : "—"}</td>
                <td style={{ padding: "10px 14px", whiteSpace: "nowrap" }}>
                  {canEdit && <button onClick={() => openEdit(c)} style={{ border: "none", background: "transparent", color: BLUE, fontSize: 12, fontWeight: 700, cursor: "pointer", marginRight: 8 }}>Edit</button>}
                  {canEdit && <button onClick={() => setReqTarget(c)} style={{ border: "none", background: "transparent", color: RED, fontSize: 11.5, cursor: "pointer" }}>Request deletion</button>}
                </td>
              </tr>
            ))}</tbody>
          </table>
        )}
      </Card>

      {deletionRequests.filter((d) => d.status === "Pending").length > 0 && (
        <Card style={{ marginTop: 16, padding: "14px 18px" }}>
          <div style={{ fontSize: 12, color: MUTED, textTransform: "uppercase", fontWeight: 600, marginBottom: 8 }}>Pending client deletions</div>
          {deletionRequests.filter((d) => d.status === "Pending").map((d) => {
            const c = clients.find((x) => x.id === d.client_id);
            return (
              <div key={d.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderTop: "1px solid " + LINE, fontSize: 13 }}>
                <div>{c ? c.name : d.client_id} — <span style={{ color: MUTED }}>{d.reason}</span>, requested by {d.requested_by}</div>
                {canApproveDelete && <div style={{ display: "flex", gap: 8 }}><Btn small onClick={() => decideDeletion(d, true)}>Approve</Btn><Btn small variant="ghost" onClick={() => decideDeletion(d, false)}>Reject</Btn></div>}
              </div>
            );
          })}
        </Card>
      )}

      {showNew && (
        <Modal title="Register new client" onClose={() => { setShowNew(false); setDupMatch(null); }}>
          <Field label="Full name"><input style={inputStyle} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} /></Field>
          <Field label="NRC"><input style={inputStyle} value={form.nrc} onChange={(e) => setForm({ ...form, nrc: e.target.value })} placeholder="000000/00/0" /></Field>
          <Field label="TPIN"><input style={inputStyle} value={form.tpin} onChange={(e) => setForm({ ...form, tpin: e.target.value })} /></Field>
          <Field label="Phone"><input style={inputStyle} value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} /></Field>
          <Field label="Next of kin"><input style={inputStyle} value={form.nok_name} onChange={(e) => setForm({ ...form, nok_name: e.target.value })} /></Field>
          {dupMatch && <div style={{ background: "#FFF4E8", border: "1px solid " + GOLD, borderRadius: 4, padding: 12, fontSize: 12.5, marginBottom: 12 }}>A client already exists with this NRC or TPIN: <b>{dupMatch.name}</b> ({dupMatch.nrc}). Use their existing profile instead.</div>}
          <Btn onClick={submit} disabled={busy}>{busy ? "Saving..." : "Save client"}</Btn>
        </Modal>
      )}
      {editTarget && (
        <Modal title={"Edit client — " + editTarget.name} onClose={() => setEditTarget(null)} wide>
          <div style={{ fontSize: 12, color: MUTED, marginBottom: 12 }}>Every change is recorded in the audit trail with the old and new value. Changing an NRC or TPIN affects duplicate detection.</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 14px" }}>
            <Field label="Full name"><input style={inputStyle} value={editForm.name} onChange={(e) => setEditForm({ ...editForm, name: e.target.value })} /></Field>
            <Field label="Registration date"><input type="date" style={inputStyle} value={editForm.registered_date} onChange={(e) => setEditForm({ ...editForm, registered_date: e.target.value })} /></Field>
            <Field label="NRC"><input style={inputStyle} value={editForm.nrc} onChange={(e) => setEditForm({ ...editForm, nrc: e.target.value })} /></Field>

/* ============================== LOANS ============================== */

function LoansView({ user, loans, clients, payments, loanLimits, refresh, logAudit, onError }) {
  const [showNew, setShowNew] = useState(false);
  const [form, setForm] = useState({ clientId: "", principal: 1500, rate: 20, period: 30, collateralDesc: "", collateralValue: "", override: false, overrideReason: "" });
  const [rejecting, setRejecting] = useState(null);
  const [rejectReason, setRejectReason] = useState("");
  const [busy, setBusy] = useState(false);
  const [editLoan, setEditLoan] = useState(null);
  const [editLoanForm, setEditLoanForm] = useState({});
  const [editLoanReason, setEditLoanReason] = useState("");
  const canEditLoan = OVERRIDE_AUTHORITY.includes(user.role);

  function openEditLoan(l) {
    if (l.rolled_over_to) { onError("Loan " + l.id + " was already rolled over into " + l.rolled_over_to + ", so its dates can no longer be edited. Edit the reloan instead."); return; }
    setEditLoanForm({ principal: l.principal, rate: l.rate, start_date: l.start_date, due_date: l.due_date, branch: l.branch || "", province: l.province || "" });
    setEditLoanReason("");
    setEditLoan(l);
  }

  async function saveLoanEdit() {
    const f = editLoanForm;
    const p = Number(f.principal);
    if (!editLoan.rollover_of && (p < loanLimits.min || p > loanLimits.max)) { onError("Loan amount must be between K" + loanLimits.min + " and K" + loanLimits.max + "."); return; }
    if (!f.start_date || !f.due_date || f.due_date < f.start_date) { onError("Due date cannot be before the loan date."); return; }
    if (!editLoanReason) { onError("Please give a reason for the change — it is recorded in the audit trail."); return; }
    const patch = {}; const changes = [];
    [["principal", true], ["rate", true], ["start_date", false], ["due_date", false], ["branch", false], ["province", false]].forEach(([k, numeric]) => {
      const oldV = editLoan[k] == null ? "" : editLoan[k];
      const newV = f[k] == null ? "" : f[k];
      const differs = numeric ? Number(oldV) !== Number(newV) : String(oldV) !== String(newV);
      if (differs) { patch[k] = numeric ? Number(newV) : (newV || null); changes.push(k + ": " + (oldV === "" ? "—" : oldV) + " → " + (newV === "" ? "—" : newV)); }
    });
    if (changes.length === 0) { setEditLoan(null); return; }
    setBusy(true);
    try {
      await sbUpdate("loans", "id", editLoan.id, patch);
      await logAudit("Loan edited", editLoan.id, changes.join("; ") + " · reason: " + editLoanReason);
      await refresh(["loans"]);
      setEditLoan(null);
    } catch (e) { onError(e.message); }
    setBusy(false);
  }
  const canApprove = ["branch_manager", "provincial_manager", ...HO_ROLES].includes(user.role);
  const rows = scopeByRole(user, loans).map((l) => ({ ...l, m: loanMath(l, payments) }));
  const activeClients = clients.filter((c) => c.record_status !== "Deleted");

  useEffect(() => { if (!form.clientId && activeClients[0]) setForm((f) => ({ ...f, clientId: activeClients[0].id })); }, [clients.length]);

  const clientHasUncleared = (clientId) => loans.some((l) => l.client_id === clientId && l.approval_status === "Approved" && !["Cleared", "Rolled over"].includes(loanMath(l, payments).status));

  async function submit() {
    const p = Number(form.principal);
    if (p < loanLimits.min || p > loanLimits.max) { alert("Loan amount must be between K" + loanLimits.min + " and K" + loanLimits.max + "."); return; }
    const blocked = clientHasUncleared(form.clientId);
    if (blocked && !(form.override && OVERRIDE_AUTHORITY.includes(user.role) && form.overrideReason)) { alert("This client has an uncleared loan. Only a Manager/Admin/Director can override, with a reason."); return; }
    setBusy(true);
    try {
      const due = new Date(Date.now() + form.period * 86400000).toISOString().slice(0, 10);
      const loanRow = await sbInsert("loans", {
        client_id: form.clientId, principal: p, rate: Number(form.rate), due_date: due,
        branch: user.branch || "Head Office", province: user.province || null, consultant_id: user.id, entered_by: user.id,
        approval_status: canApprove ? "Approved" : "Pending", approved_by: canApprove ? user.id : null,
        override_reason: blocked ? form.overrideReason : null,
      });
      if (form.collateralDesc) {
        await sbInsert("collateral", { loan_id: loanRow.id, description: form.collateralDesc, type: "General", value: Number(form.collateralValue) || 0, owner: (clients.find((c) => c.id === form.clientId) || {}).name, status: "Held" });
      }
      await logAudit(blocked ? "Loan created (override — uncleared loan on file)" : "Loan created", loanRow.id, "Principal " + fmtK(p) + (blocked ? " · reason: " + form.overrideReason : ""));
      await refresh(["loans", "collateral"]);
      setShowNew(false);
      setForm({ clientId: activeClients[0] ? activeClients[0].id : "", principal: 1500, rate: 20, period: 30, collateralDesc: "", collateralValue: "", override: false, overrideReason: "" });
    } catch (e) { onError(e.message); }
    setBusy(false);
  }
  async function approve(id) {
    try { await sbUpdate("loans", "id", id, { approval_status: "Approved", approved_by: user.id }); await logAudit("Loan approved", id, ""); await refresh(["loans"]); }
    catch (e) { onError(e.message); }
  }
  async function reject() {
    try { await sbUpdate("loans", "id", rejecting, { approval_status: "Rejected", reject_reason: rejectReason, approved_by: user.id }); await logAudit("Loan rejected", rejecting, rejectReason); await refresh(["loans"]); setRejecting(null); setRejectReason(""); }
    catch (e) { onError(e.message); }
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
        <div style={{ fontFamily: FONT_SERIF, fontSize: 19, color: NAVY }}>Loans</div>
        <Btn onClick={() => setShowNew(true)} variant="gold">+ Register loan</Btn>
      </div>
      <Card>
        {rows.length === 0 ? <EmptyState text="No loans in your scope." /> : (
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead><tr style={{ textAlign: "left", background: BG }}>{["Loan #", "Client", "Loan date", "Due date", "Principal", "Owed", "Balance", "Status", "Approval", ""].map((h) => <th key={h} style={{ padding: "10px 14px", fontSize: 11, color: MUTED, textTransform: "uppercase", letterSpacing: "0.04em" }}>{h}</th>)}</tr></thead>
            <tbody>{rows.map((l) => {
              const client = clients.find((c) => c.id === l.client_id);
              const isRejected = l.approval_status === "Rejected";
              return (
                <tr key={l.id} style={{ borderTop: "1px solid " + LINE }}>
                  <td style={{ padding: "10px 14px", fontWeight: 700, color: NAVY }}>{l.id}</td>
                  <td style={{ padding: "10px 14px" }}>{client ? client.name : "—"}{l.rollover_of && <div style={{ fontSize: 10.5, color: RED, fontWeight: 700 }}>{ROLLOVER_RATE}% reloan of {l.rollover_of} (final penalty)</div>}{l.rolled_over_to && <div style={{ fontSize: 10.5, color: MUTED }}>balance carried into {l.rolled_over_to}</div>}</td>
                  <td style={{ padding: "10px 14px", whiteSpace: "nowrap" }}>{l.start_date}</td>
                  <td style={{ padding: "10px 14px", whiteSpace: "nowrap" }}>{l.due_date}</td>
                  <td style={{ padding: "10px 14px" }}>{fmtK(l.principal)}</td>
                  <td style={{ padding: "10px 14px" }}>{isRejected ? "—" : fmtK(Math.round(l.m.totalOwed))}</td>
                  <td style={{ padding: "10px 14px", fontWeight: 600 }}>{isRejected ? "—" : fmtK(Math.round(l.m.balance))}</td>
                  <td style={{ padding: "10px 14px" }}><Badge text={isRejected ? "Rejected" : l.m.status} color={STATUS_COLOR[isRejected ? "Rejected" : l.m.status]} /></td>
                  <td style={{ padding: "10px 14px" }}>{l.approval_status}{isRejected && <div style={{ fontSize: 10.5, color: MUTED }}>{l.reject_reason}</div>}</td>
                  <td style={{ padding: "10px 14px", display: "flex", gap: 6 }}>{canEditLoan && <Btn small variant="ghost" onClick={() => openEditLoan(l)}>Edit</Btn>}{l.approval_status === "Pending" && canApprove && (<><Btn small onClick={() => approve(l.id)}>Approve</Btn><Btn small variant="ghost" onClick={() => setRejecting(l.id)}>Reject</Btn></>)}</td>
                </tr>
              );
            })}</tbody>
          </table>
        )}
      </Card>

      {showNew && (
        <Modal title="Register loan" onClose={() => setShowNew(false)} wide>
          <Field label="Client">
            <select style={inputStyle} value={form.clientId} onChange={(e) => setForm({ ...form, clientId: e.target.value })}>
              {activeClients.map((c) => <option key={c.id} value={c.id}>{c.name} — {c.nrc}</option>)}
            </select>
          </Field>
          {clientHasUncleared(form.clientId) && (
            <div style={{ background: "#FFF4E8", border: "1px solid " + GOLD, borderRadius: 4, padding: 12, fontSize: 12.5, marginBottom: 12 }}>
              This client has an uncleared loan on file.
              {OVERRIDE_AUTHORITY.includes(user.role) && (
                <div style={{ marginTop: 8 }}>
                  <label style={{ fontSize: 12, display: "flex", gap: 6, alignItems: "center" }}><input type="checkbox" checked={form.override} onChange={(e) => setForm({ ...form, override: e.target.checked })} /> Override and proceed</label>
                  {form.override && <input style={{ ...inputStyle, marginTop: 6 }} placeholder="Reason for override (required)" value={form.overrideReason} onChange={(e) => setForm({ ...form, overrideReason: e.target.value })} />}
                </div>
              )}
            </div>
          )}
          <Field label={"Principal (ZMW) — K" + loanLimits.min + " to K" + loanLimits.max}><input type="number" style={inputStyle} value={form.principal} onChange={(e) => setForm({ ...form, principal: e.target.value })} /></Field>
          <Field label="Interest rate (%)"><input type="number" style={inputStyle} value={form.rate} onChange={(e) => setForm({ ...form, rate: e.target.value })} /></Field>
          <Field label="Period (days)"><input type="number" style={inputStyle} value={form.period} onChange={(e) => setForm({ ...form, period: e.target.value })} /></Field>
          <Field label="Collateral description (optional)"><input style={inputStyle} value={form.collateralDesc} onChange={(e) => setForm({ ...form, collateralDesc: e.target.value })} /></Field>
          {form.collateralDesc && <Field label="Estimated collateral value (ZMW)"><input type="number" style={inputStyle} value={form.collateralValue} onChange={(e) => setForm({ ...form, collateralValue: e.target.value })} /></Field>}
          <Btn onClick={submit} disabled={busy}>{busy ? "Saving..." : "Submit loan"}</Btn>
        </Modal>
      )}
      {editLoan && (
        <Modal title={"Edit loan — " + editLoan.id} onClose={() => setEditLoan(null)} wide>
          <div style={{ fontSize: 12, color: MUTED, marginBottom: 12 }}>Every change is recorded in the audit trail with the old and new value. Changing dates changes when penalties start, and a loan 30 days past its due date is automatically re-loaned at {ROLLOVER_RATE}%.</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 14px" }}>
            <Field label="Loan date"><input type="date" style={inputStyle} value={editLoanForm.start_date} onChange={(e) => setEditLoanForm({ ...editLoanForm, start_date: e.target.value })} /></Field>
            <Field label="Due date"><input type="date" style={inputStyle} value={editLoanForm.due_date} onChange={(e) => setEditLoanForm({ ...editLoanForm, due_date: e.target.value })} /></Field>
            <Field label="Principal (ZMW)"><input type="number" style={inputStyle} value={editLoanForm.principal} onChange={(e) => setEditLoanForm({ ...editLoanForm, principal: e.target.value })} /></Field>
            <Field label="Interest rate (%)"><input type="number" style={inputStyle} value={editLoanForm.rate} onChange={(e) => setEditLoanForm({ ...editLoanForm, rate: e.target.value })} /></Field>
            <Field label="Branch"><input style={inputStyle} value={editLoanForm.branch} onChange={(e) => setEditLoanForm({ ...editLoanForm, branch: e.target.value })} /></Field>
            <Field label="Province"><select style={inputStyle} value={editLoanForm.province} onChange={(e) => setEditLoanForm({ ...editLoanForm, province: e.target.value })}><option value="">—</option>{PROVINCES.map((p) => <option key={p}>{p}</option>)}</select></Field>
          </div>
          <Field label="Reason for change (required)"><input style={inputStyle} value={editLoanReason} onChange={(e) => setEditLoanReason(e.target.value)} placeholder="e.g. Loan date was captured wrongly" /></Field>
          <Btn onClick={saveLoanEdit} disabled={busy}>{busy ? "Saving..." : "Save changes"}</Btn>
        </Modal>
      )}
      {rejecting && (
        <Modal title="Reject loan" onClose={() => setRejecting(null)}>
          <Field label="Reason">
            <select style={inputStyle} value={rejectReason} onChange={(e) => setRejectReason(e.target.value)}>
              <option value="">Select a reason...</option>
              {["Existing outstanding loan", "Failed KYC", "Invalid NRC", "Invalid TPIN", "Insufficient information", "Failed credit assessment", "Insufficient collateral", "Other"].map((r) => <option key={r}>{r}</option>)}
            </select>
          </Field>
          <Btn variant="danger" onClick={reject} disabled={!rejectReason}>Confirm rejection</Btn>
        </Modal>
      )}
    </div>
  );
}

/* ============================== PAYMENTS ============================== */

function PaymentsView({ user, loans, payments, clients, refresh, logAudit, onError }) {
  const [loanId, setLoanId] = useState("");
  const [amount, setAmount] = useState("");
  const [backdate, setBackdate] = useState(false);
  const [txnDate, setTxnDate] = useState(todayISO());
  const [reason, setReason] = useState("");
  const [busy, setBusy] = useState(false);
  const scoped = scopeByRole(user, loans).filter((l) => l.approval_status === "Approved" && !l.rolled_over_to);
  const loan = scoped.find((l) => l.id === loanId);
  const m = loan ? loanMath(loan, payments) : null;
  const canBackdate = OVERRIDE_AUTHORITY.includes(user.role);

  async function record() {
    if (!loan || !amount) return;
    if (backdate && !reason) { alert("A reason is required for a backdated transaction."); return; }
    setBusy(true);
    try {
      const capped = Math.min(Number(amount), m.balance);
      await sbInsert("payments", { loan_id: loan.id, amount: capped, date: backdate ? txnDate : todayISO(), backdated: backdate, reason: backdate ? reason : null, entered_by: user.id });
      await logAudit(backdate ? "Payment recorded (backdated)" : "Payment recorded", loan.id, fmtK(capped) + (backdate ? " · dated " + txnDate + " · " + reason : ""));
      await refresh(["payments"]);
      setAmount(""); setBackdate(false); setReason("");
    } catch (e) { onError(e.message); }
    setBusy(false);
  }

  return (
    <div>
      <div style={{ fontFamily: FONT_SERIF, fontSize: 19, color: NAVY, marginBottom: 14 }}>Record a payment</div>
      <Card style={{ padding: 22, maxWidth: 480 }}>
        <Field label="Loan number">
          <select style={inputStyle} value={loanId} onChange={(e) => setLoanId(e.target.value)}>
            <option value="">Search by loan no...</option>
            {scoped.map((l) => { const c = clients.find((x) => x.id === l.client_id); return <option key={l.id} value={l.id}>{l.id} — {c ? c.name : ""}</option>; })}
          </select>
        </Field>
        {loan && m && (
          <div style={{ background: BG, borderRadius: 4, padding: 12, fontSize: 12.5, marginBottom: 12 }}>
            <div>Principal + interest: <b>{fmtK(Math.round(m.baseOwed))}</b></div>
            <div>Penalty accrued: <b style={{ color: m.penalty ? RED : INK }}>{fmtK(Math.round(m.penalty))}</b></div>
            <div>Total owed: <b>{fmtK(Math.round(m.totalOwed))}</b></div>
            <div>Already paid: <b>{fmtK(Math.round(m.paid))}</b></div>
            <div style={{ borderTop: "1px solid " + LINE, marginTop: 6, paddingTop: 6 }}>Balance due: <b style={{ color: NAVY }}>{fmtK(Math.round(m.balance))}</b></div>
          </div>
        )}
        <Field label="Amount received (ZMW)"><input type="number" style={inputStyle} value={amount} onChange={(e) => setAmount(e.target.value)} disabled={!loan} /></Field>
        {canBackdate && (
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: 12, display: "flex", gap: 6, alignItems: "center" }}><input type="checkbox" checked={backdate} onChange={(e) => setBackdate(e.target.checked)} /> This is a backdated transaction</label>
            {backdate && <div style={{ marginTop: 8, display: "grid", gap: 8 }}><input type="date" style={inputStyle} value={txnDate} onChange={(e) => setTxnDate(e.target.value)} /><input style={inputStyle} placeholder="Reason for backdating (required)" value={reason} onChange={(e) => setReason(e.target.value)} /></div>}
          </div>
        )}
        <Btn onClick={record} disabled={busy}>{busy ? "Saving..." : "Record payment"}</Btn>
        {loan && m && m.status === "Cleared" && <div style={{ marginTop: 14, fontSize: 12.5, color: GREEN, fontWeight: 700 }}>Loan cleared — clearance certificate available from Reports.</div>}
      </Card>
    </div>
  );
}

function OverdueView({ user, loans, payments, clients }) {
  const scoped = scopeByRole(user, loans).filter((l) => l.approval_status === "Approved").map((l) => ({ ...l, m: loanMath(l, payments) })).filter((l) => l.m.status === "Overdue" || l.m.status === "Defaulted");

            <tbody>{scoped.map((l) => {
              const c = clients.find((x) => x.id === l.client_id);
              const waText = encodeURIComponent("Hello " + (c ? c.name : "") + ", your loan " + l.id + " has a balance of K" + Math.round(l.m.balance) + ". Kindly settle at your earliest.");
              return (
                <tr key={l.id} style={{ borderTop: "1px solid " + LINE }}>
                  <td style={{ padding: "10px 14px", fontWeight: 700, color: NAVY }}>{l.id}</td>
                  <td style={{ padding: "10px 14px" }}>{c ? c.name : "—"}</td>
                  <td style={{ padding: "10px 14px" }}>{l.m.lateDays}</td>

function FinanceView({ user, bank, branchFunds, refresh, logAudit, onError }) {
  const [alloc, setAlloc] = useState({ branch: "Lusaka Central", amount: 5000 });
  const [busy, setBusy] = useState(false);
  const canManage = ["accountant", "admin", "ceo", "director", "provincial_manager"].includes(user.role);
  if (!canManage) return <EmptyState text="Finance is visible to Accountant, Admin, CEO, Director and Provincial Managers." />;
  async function allocate() {
    setBusy(true);
    try {
      const existing = branchFunds.find((b) => b.branch === alloc.branch);
      const newAmount = (existing ? Number(existing.amount) : 0) + Number(alloc.amount);
      await sbUpsert("branch_funds", { branch: alloc.branch, amount: newAmount }, "branch");
      await sbUpdate("bank_account", "id", 1, { balance: Number(bank) - Number(alloc.amount) });
      await logAudit("Branch fund allocated", alloc.branch, fmtK(alloc.amount));
      await refresh(["branchFunds", "bank"]);
    } catch (e) { onError(e.message); }
    setBusy(false);
  }
  return (
    <div>
      <div style={{ fontFamily: FONT_SERIF, fontSize: 19, color: NAVY, marginBottom: 14 }}>Finance &amp; funds</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
        <Card style={{ padding: 22 }}>
          <div style={{ fontSize: 12, color: MUTED, textTransform: "uppercase", fontWeight: 600 }}>Central bank balance</div>
          <div style={{ fontFamily: FONT_SERIF, fontSize: 28, color: NAVY, fontWeight: 700, margin: "6px 0 14px" }}>{fmtK(bank)}</div>
          <div style={{ fontSize: 12, color: MUTED, marginBottom: 14 }}>Branch funds allocated:</div>
          {branchFunds.length === 0 ? <div style={{ fontSize: 12, color: MUTED }}>None yet.</div> : branchFunds.map((b) => <div key={b.branch} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "5px 0", borderTop: "1px solid " + LINE }}><span>{b.branch}</span><span style={{ fontWeight: 600 }}>{fmtK(b.amount)}</span></div>)}
        </Card>
        <Card style={{ padding: 22 }}>
          <div style={{ fontSize: 12, color: MUTED, textTransform: "uppercase", fontWeight: 600, marginBottom: 12 }}>Allocate to branch</div>

          <Field label="Amount (ZMW)"><input type="number" style={inputStyle} value={alloc.amount} onChange={(e) => setAlloc({ ...alloc, amount: e.target.value })} /></Field>

function ReportsView({ user, loans, payments, clients, collateral, auditLog, backupHistory }) {
  const [showReport, setShowReport] = useState(false);
  const scoped = scopeByRole(user, loans).filter((l) => l.approval_status === "Approved").map((l) => ({ ...l, m: loanMath(l, payments) }));
  const totalOwed = scoped.reduce((s, l) => s + l.m.totalOwed, 0);
  const totalPaid = scoped.reduce((s, l) => s + l.m.paid, 0);
  const overdue = scoped.filter((l) => l.m.status === "Overdue" || l.m.status === "Defaulted").length;
  const rejected = scopeByRole(user, loans).filter((l) => l.approval_status === "Rejected").length;
  const recovery = totalOwed > 0 ? Math.round((totalPaid / totalOwed) * 100) : 0;

  const counts = {
    "Client List Report": scopeByRole(user, clients).filter((c) => c.record_status !== "Deleted").length,
    "Loan Report": scoped.length, "Active Loan Report": scoped.filter((l) => l.m.status === "Active").length,
    "Cleared Loan Report": scoped.filter((l) => l.m.status === "Cleared").length,
    "Outstanding Loan Report": scoped.filter((l) => l.m.balance > 0).length, "Rejected Loan Report": rejected,
    "Repayment Report": payments.length, "Penalty Report": scoped.filter((l) => l.m.penalty > 0).length,
    "Collateral Report": collateral.length, "User Activity Report": auditLog.length, "Audit Trail Report": auditLog.length,
    "Backdated Transaction Report": payments.filter((p) => p.backdated).length,
    "Deleted Client Report": clients.filter((c) => c.record_status === "Deleted").length,
    "Backup Report": backupHistory.length,
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}>
        <div style={{ fontFamily: FONT_SERIF, fontSize: 19, color: NAVY }}>Reports</div>
        <Btn variant="gold" onClick={() => setShowReport(true)}>Generate financial report</Btn>
      </div>
      <Card style={{ padding: "6px 0", marginBottom: 18 }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(190px, 1fr))" }}>
          {REPORT_LIST.map((r) => (
            <div key={r} style={{ padding: "11px 16px", borderTop: "1px solid " + LINE, fontSize: 12.5 }}>
              <div style={{ fontWeight: 600, color: INK }}>{r}</div>
              <div style={{ color: MUTED, fontSize: 11.5 }}>{counts[r] !== undefined ? counts[r] + " records" : "Available on export"}</div>
            </div>
          ))}
        </div>
      </Card>
      {showReport && (
        <Modal title="Financial report" onClose={() => setShowReport(false)} wide>
          <div style={{ position: "relative", paddingBottom: 20 }}>
            <img src={LOGO} alt="Pallian Money Lending" style={{ height: 42, marginBottom: 14 }} />
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <tbody>
                {[["Scope", HO_ROLES.includes(user.role) ? "National" : user.province || user.branch], ["Total owed across scope", fmtK(Math.round(totalOwed))], ["Total collected", fmtK(Math.round(totalPaid))], ["Recovery rate", recovery + "%"], ["Overdue / defaulted loans", String(overdue)], ["Rejected loans", String(rejected)]].map((r) => (
                  <tr key={r[0]} style={{ borderTop: "1px solid " + LINE }}><td style={{ padding: "9px 0", color: MUTED }}>{r[0]}</td><td style={{ padding: "9px 0", textAlign: "right", fontWeight: 700, color: NAVY }}>{r[1]}</td></tr>
                ))}
              </tbody>
            </table>
            <img src={STAMP} alt="Official stamp" style={{ position: "absolute", width: 118, right: 10, bottom: -6, transform: "rotate(-11deg)", opacity: 0.92, filter: "drop-shadow(0 2px 3px rgba(0,0,0,0.15))" }} />
          </div>
          <div style={{ fontSize: 11.5, color: MUTED, borderTop: "1px solid " + LINE, paddingTop: 10 }}>Live figures straight from Supabase. Stamp applies automatically once PDF export (jsPDF) is added.</div>
        </Modal>

const TABLES = ["staff", "clients", "loans", "payments", "leave_requests", "messages", "parcels", "collateral", "deletion_requests", "audit_log", "branch_funds", "bank_account", "backup_history", "system_settings"];

function PallianApp() {
  const [screen, setScreen] = useState("welcome");
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [saveError, setSaveError] = useState(null);
  const [needsBootstrap, setNeedsBootstrap] = useState(false);

  const [user, setUser] = useState(null);
  const [needsPinChange, setNeedsPinChange] = useState(false);
  const [system, setSystem] = useState(null);
  const [tab, setTab] = useState("dashboard");

  const [staff, setStaff] = useState([]);
  const [clients, setClients] = useState([]);
  const [loans, setLoans] = useState([]);
  const [payments, setPayments] = useState([]);
  const [leave, setLeave] = useState([]);
  const [messages, setMessages] = useState([]);
  const [parcels, setParcels] = useState([]);
  const [collateral, setCollateral] = useState([]);
  const [deletionRequests, setDeletionRequests] = useState([]);
  const [auditLog, setAuditLog] = useState([]);
  const [bank, setBank] = useState(0);
  const [branchFunds, setBranchFunds] = useState([]);
  const [loanLimits, setLoanLimits] = useState({ min: LOAN_MIN_DEFAULT, max: LOAN_MAX_DEFAULT });
  const [penaltyRate, setPenaltyRate] = useState(5);
  const [backupStatus, setBackupStatus] = useState({ enabled: true, last: null, lastOk: false });
  const [backupHistory, setBackupHistory] = useState([]);

  const setters = {
    staff: setStaff, clients: setClients, loans: setLoans, payments: setPayments, leave: setLeave,
    messages: setMessages, parcels: setParcels, collateral: setCollateral, deletionRequests: setDeletionRequests,
    auditLog: setAuditLog, branchFunds: setBranchFunds, backupHistory: setBackupHistory,
  };
  const tableFor = {
    staff: "staff", clients: "clients", loans: "loans", payments: "payments", leave: "leave_requests",
    messages: "messages", parcels: "parcels", collateral: "collateral", deletionRequests: "deletion_requests",
    auditLog: "audit_log", branchFunds: "branch_funds", backupHistory: "backup_history",
  };

  const refresh = useCallback(async (keys) => {
    try {
      const list = keys || Object.keys(tableFor);
      const results = await Promise.all(list.map((k) => sbSelect(tableFor[k], k === "auditLog" ? "order=logged_at.asc" : k === "backupHistory" ? "order=ran_at.asc" : "")));
      list.forEach((k, i) => setters[k](results[i]));
      if (list.includes("bank") || !keys) {
        const b = await sbSelect("bank_account");
        if (b[0]) setBank(b[0].balance);
      }
      if (!keys || list.includes("settings")) {
        const s = await sbSelect("system_settings");
        const lim = s.find((x) => x.key === "loan_limits");
        const pen = s.find((x) => x.key === "penalty_rate_per_day");
        if (lim) setLoanLimits(lim.value);
        if (pen) setPenaltyRate(Number(pen.value));
      }
    } catch (e) { setSaveError(e.message); }
  }, []);

  async function logAudit(action, record, detail) {
    try {
      const row = await sbInsert("audit_log", { user_name: user ? user.name : "System", action, record: record || "—", detail: detail || "" });
      setAuditLog((prev) => [...prev, row]);
    } catch (e) { setSaveError(e.message); }
  }

  async function runBackupNow() {
    try {
      const file = "pallian-backup-" + todayISO() + "-" + nowTime().replace(":", "") + ".json";
      const row = await sbInsert("backup_history", { file, status: "Success" });
      setBackupHistory((prev) => [...prev, row]);
      setBackupStatus((prev) => ({ ...prev, last: new Date(row.ran_at).toLocaleString(), lastOk: true }));
    } catch (e) {
      setBackupStatus((prev) => ({ ...prev, lastOk: false }));
      setSaveError(e.message);
    }
  }

  // Initial load
  useEffect(() => {
    (async () => {
      try {
        const staffRows = await sbSelect("staff");
        setStaff(staffRows);
        if (staffRows.length === 0) { setNeedsBootstrap(true); setLoading(false); return; }
        await refresh();
        setLoading(false);
      } catch (e) { setLoadError(e.message); setLoading(false); }
    })();
  }, []);

  const didBackupInit = useRef(false);
  useEffect(() => {
    if (loading || needsBootstrap) return;
    if (!didBackupInit.current) { didBackupInit.current = true; runBackupNow(); }
    const interval = setInterval(() => { if (backupStatus.enabled) runBackupNow(); }, 90000);
    return () => clearInterval(interval);
    // eslint-disable-next-line
  }, [loading, needsBootstrap, backupStatus.enabled]);

  const hasBothSystems = user && HO_ROLES.includes(user.role);

  // Automatic 30% reloan: any approved loan still not cleared 30 days after its due date
  // has its balance re-loaned at ROLLOVER_RATE%. That is the last penalty (no repeat).
  const rolloverBusy = useRef(false);
  useEffect(() => {
    if (loading || needsBootstrap || !user || rolloverBusy.current) return;
    const due = loans.filter((l) => l.approval_status === "Approved" && !l.rolled_over_to && !l.rollover_of && !["Cleared"].includes(loanMath(l, payments).status) && loanMath(l, payments).lateDays >= 30);
    if (due.length === 0) return;
    rolloverBusy.current = true;
    (async () => {
      try {
        for (const l of due) {
          const m = loanMath(l, payments);
          const newId = "L-" + new Date().getFullYear() + "-R" + Math.random().toString(36).slice(2, 8).toUpperCase();
          // claim the original first so two browsers cannot both roll it over
          const res = await fetch(REST + "loans?id=eq." + encodeURIComponent(l.id) + "&rolled_over_to=is.null", { method: "PATCH", headers: sbHeaders({ Prefer: "return=representation" }), body: JSON.stringify({ rolled_over_to: newId, rolled_over_at: new Date().toISOString() }) });
          if (!res.ok) throw new Error("loans rollover claim failed: " + (await res.text()));
          const claimed = await res.json();
          if (!claimed.length) continue;
          try {
            await sbInsert("loans", {
              id: newId, client_id: l.client_id, principal: Math.round(m.balance * 100) / 100, rate: ROLLOVER_RATE,
              start_date: todayISO(), due_date: new Date(Date.now() + 30 * 86400000).toISOString().slice(0, 10),
              branch: l.branch, province: l.province, consultant_id: l.consultant_id, entered_by: l.entered_by,
              approval_status: "Approved", approved_by: l.approved_by, rollover_of: l.id,
            });
          } catch (insErr) {
            await sbUpdate("loans", "id", l.id, { rolled_over_to: null, rolled_over_at: null });
            throw insErr;
          }
          await sbInsert("audit_log", { user_name: "System (auto)", action: "Loan auto-rolled over (final " + ROLLOVER_RATE + "% penalty)", record: l.id, detail: "Balance " + fmtK(Math.round(m.balance)) + " carried into " + newId + " at " + ROLLOVER_RATE + "%" });
        }
        await refresh(["loans", "auditLog"]);
      } catch (e) { setSaveError(e.message); }
      rolloverBusy.current = false;
    })();
  }, [loading, needsBootstrap, user, loans, payments]);

  function onLogin(u) {
    setUser(u);
    logAudit("Login", u.id, "");
    if (u.must_change_pin) { setNeedsPinChange(true); return; }
    if (HO_ROLES.includes(u.role)) setSystem(null); else setSystem("loans");
  }
  function finishPinChange() {
    setUser((u) => ({ ...u, must_change_pin: false }));
    logAudit("PIN changed (first login)", user.id, "");
    setNeedsPinChange(false);
    refresh(["staff"]);
    if (HO_ROLES.includes(user.role)) setSystem(null); else setSystem("loans");
  }
  function logout() { setUser(null); setSystem(null); setTab("dashboard"); setNeedsPinChange(false); }

  let body;
  if (loading) {
    body = <div style={{ minHeight: "100%", background: NAVY, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontFamily: FONT_SANS, fontSize: 13 }}>Connecting to your Supabase project...</div>;
  } else if (loadError) {
    body = <div style={{ minHeight: "100%", background: NAVY, display: "flex", alignItems: "center", justifyContent: "center", padding: 30 }}><div style={{ background: CARD, borderRadius: 8, padding: 26, maxWidth: 420, fontSize: 13, color: RED }}><b>Could not connect to Supabase.</b><div style={{ marginTop: 8, color: MUTED }}>{loadError}</div></div></div>;
  } else if (needsBootstrap) {
    body = <BootstrapAdmin onDone={(row) => { setStaff([row]); setNeedsBootstrap(false); refresh(); }} onError={setSaveError} />;
  } else if (screen === "welcome") {
    body = <WelcomeScreen onContinue={() => setScreen("login")} />;
  } else if (!user) {
    body = <LoginScreen onLogin={onLogin} onError={setSaveError} />;
  } else if (needsPinChange) {
    body = <ForcePinChange user={user} onDone={finishPinChange} onError={setSaveError} />;
  } else if (!system) {
    body = <SystemSelect user={user} onSelect={setSystem} />;
  } else if (system === "ptdc") {
    body = (
      <div style={{ display: "flex", minHeight: "100%" }}>
        <Sidebar user={user} active="ptdc" setActive={() => {}} onSwitchSystem={() => setSystem(null)} showSystemSwitch={hasBothSystems} onLogout={logout} />
        <div style={{ flex: 1, padding: "26px 30px", background: BG }}><PTDCView user={user} parcels={parcels} refresh={refresh} onError={setSaveError} /></div>
      </div>
    );
  } else {
    const views = {
      dashboard: <DashboardView user={user} loans={loans} payments={payments} clients={clients} backupStatus={backupStatus} />,
      clients: <ClientsView user={user} clients={clients} loans={loans} refresh={refresh} logAudit={logAudit} deletionRequests={deletionRequests} onError={setSaveError} />,
      loans: <LoansView user={user} loans={loans} clients={clients} payments={payments} loanLimits={loanLimits} refresh={refresh} logAudit={logAudit} onError={setSaveError} />,
      collateral: <CollateralView user={user} collateral={collateral} loans={loans} />,
      payments: <PaymentsView user={user} loans={loans} payments={payments} clients={clients} refresh={refresh} logAudit={logAudit} onError={setSaveError} />,
      overdue: <OverdueView user={user} loans={loans} payments={payments} clients={clients} />,
      alerts: <AlertsView user={user} loans={loans} clients={clients} />,
      staff: <StaffView user={user} staff={staff} leave={leave} refresh={refresh} logAudit={logAudit} onError={setSaveError} />,
      finance: <FinanceView user={user} bank={bank} branchFunds={branchFunds} refresh={refresh} logAudit={logAudit} onError={setSaveError} />,
      messages: <MessagesView user={user} messages={messages} staff={staff} refresh={refresh} onError={setSaveError} />,
      reports: <ReportsView user={user} loans={loans} payments={payments} clients={clients} collateral={collateral} auditLog={auditLog} backupHistory={backupHistory} />,
      audit: <AuditView user={user} auditLog={auditLog} />,
      backup: <BackupView user={user} backupHistory={backupHistory} backupStatus={backupStatus} setBackupStatus={setBackupStatus} runBackupNow={runBackupNow} />,
      settings: <SettingsView user={user} loanLimits={loanLimits} penaltyRate={penaltyRate} refresh={refresh} onError={setSaveError} />,
    };
    body = (
      <div style={{ display: "flex", minHeight: "100%" }}>
        <Sidebar user={user} active={tab} setActive={setTab} onSwitchSystem={() => setSystem(null)} showSystemSwitch={hasBothSystems} onLogout={logout} />
        <div style={{ flex: 1, padding: "26px 30px", background: BG, overflowY: "auto" }}>{views[tab]}</div>
      </div>
    );
  }

  return (
    <div style={{ fontFamily: FONT_SANS, minHeight: "100%", color: INK }}>
      <GFont />
      {body}
      <SaveError err={saveError} onClose={() => setSaveError(null)} />
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PallianApp />);
</script>
</body>
</html>
